<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="DrSSim">
  <link rel="icon" href="assets/app-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <title>DrSSim</title>
  <link rel="stylesheet" href="styles.css?v=launch-9">
  <!-- Use one module cache version after the SVG migration. -->
  <script type="importmap">{"imports":{"./src/tisch.js":"./src/tisch.js?v=svg-1","./src/tiles.js":"./src/tiles.js?v=svg-1","./src/viewport.js":"./src/viewport.js?v=svg-1","./src/locales/tr.js":"./src/locales/tr.js?v=svg-1","./src/locales/en.js":"./src/locales/en.js?v=svg-1"}}</script>
</head>
<body>
  <main id="station-selection" hidden>
    <header class="station-selection-header">
      <h1>DrSSim</h1>
      <div class="launch-language">
        <button id="launch-language-toggle" class="menu-bar-pill" type="button" data-i18n="simulation.language" aria-haspopup="menu" aria-expanded="false" aria-controls="launch-language-menu">Language</button>
        <div id="launch-language-menu" class="failures-panel" role="menu" aria-labelledby="launch-language-toggle" hidden></div>
      </div>
    </header>
    <p class="station-selection-welcome" data-i18n="launch.description">Simulation of the old DrS interlockings on the Sirkeci–Halkalı line in Istanbul</p>
    <hr class="station-selection-rule">
    <form id="launch-form" autocomplete="off">
      <fieldset>
        <legend data-i18n="launch.interlocking">Interlocking</legend>
        <div class="station-selection-list"></div>
      </fieldset>
      <button class="launch-submit" type="submit" data-i18n="launch.start">Start Simulation</button>
    </form>
  </main>
  <div id="viewport" hidden><div id="desk" class="desk" data-tisch="./config/yesilkoy.json" data-graph="./config/graphs/yesilkoy.json" data-model-bindings="./config/model-bindings/yesilkoy.json" data-interlocking="./config/interlocking/yesilkoy.json" role="group" aria-label="Control desk"></div></div>
  <div id="simulation-ui" hidden><div id="trains-menu"><button id="simulation-toggle" class="menu-bar-pill" type="button" data-i18n="simulation.title" aria-expanded="false" aria-haspopup="menu" aria-controls="simulation-dropdown">Simulation</button><button id="trains-toggle" type="button" data-i18n="trains.title" aria-expanded="false">Trains</button><button id="failures-toggle" type="button" data-i18n="failures.title" aria-expanded="false">Failures</button><button id="help-toggle" type="button" data-i18n="help.title" aria-expanded="false" aria-haspopup="menu">Help</button><button id="reset-view" type="button" data-i18n="view.reset" hidden>Reset view</button><div id="trains-dropdown" hidden><div id="trains-list"></div><button id="train-add" type="button" data-i18n="trains.add" aria-expanded="false" aria-controls="train-locations">Add train at signal</button></div></div><div id="help-dropdown" class="failures-panel" role="menu" hidden></div><div id="simulation-dropdown" class="failures-panel" role="menu" hidden></div><div id="simulation-languages" class="failures-panel" role="menu" hidden></div><div id="failures-dropdown" class="failures-panel" role="menu" hidden></div><div id="failure-items" class="failures-panel" role="menu" hidden></div><div id="failure-options" class="failures-panel" role="menu" hidden></div><div id="train-locations" hidden></div><div id="train-options" hidden></div><div id="hold-tip" class="help-tooltip" role="status" aria-live="polite" aria-atomic="true" hidden><span id="hold-tip-label"></span><span id="hold-tip-message"></span></div></div>
  <script type="module" src="src/bootstrap.js"></script>
</body>
</html>
